name: Deploy Sadarshop to Namecheap

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd /home/satnqpja/sadarshop.com
            git pull origin main
            ~/nodevenv/sadarshop.com/22/bin/npm install --omit=dev
            mkdir -p tmp
            touch tmp/restart.txt
            echo "✅ Sadarshop deployment complete"
